<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Frame — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="top">
  <h1>Vice Frame</h1>
  <p>Your photo and a caption, made into GTA-style multi-panel cover art.</p>
</header>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <div class="group">
      <h2>Layout — <span id="layout-name">Vice Grid</span></h2>
      <div id="layout-pick" class="picks" role="group" aria-label="Layout"></div>
    </div>
    <div class="group">
      <h2>Grade — <span id="grade-name">Sunset</span></h2>
      <div id="grade-pick" class="picks" role="group" aria-label="Colour grade"></div>
    </div>
    <div class="group">
      <h2 id="panel-label">Panel 1 of 4</h2>
      <p class="hint">Click a panel on the cover to select it, then crop it and give it a role.</p>
      <label>Photo for this panel <input id="photo" type="file" accept="image/*"></label>
      <button id="load-samples" type="button">Load the sample photos</button>
      <label>Zoom <input id="zoom" type="range" min="1" max="3" step="0.05" value="1"></label>
      <label>Pan left–right <input id="panx" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Pan up–down <input id="pany" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
      <label>Role tag <input id="role" type="text" maxlength="24" value="THE INSIDER"></label>
      <label class="check"><input id="smart-crop" type="checkbox"> Smart crop — click a face on the cover to pin it as this panel's focal point</label>
      <button id="reset-focal" type="button">Reset focal point</button>
    </div>
    <div class="group">
      <h2>Poster text</h2>
      <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Script subtitle <input id="subtitle" type="text" maxlength="40" value="Vice City"></label>
      <label>Press quote <input id="quote" type="text" maxlength="80" value="The city never sleeps. Neither do we."></label>
      <label>Volume <input id="volume" type="text" maxlength="12" value="1"></label>
      <label>Tagline <input id="tagline" type="text" maxlength="60" value="Every empire starts with one job"></label>
      <label>Billing <input id="billing" type="text" maxlength="90" value="A Vice Frame original · Made with photos on your own machine"></label>
      <label class="check"><input id="furniture" type="checkbox" checked> Poster furniture (title, quote, badge, seal, barcode, stamp)</label>
      <label class="check"><input id="popout" type="checkbox"> Pop-out hero — the biggest panel breaks its frame, tilted and lifted</label>
    </div>
    <div class="group">
      <h2>Export PNG</h2>
      <div class="exports">
        <button id="export-square" type="button">1080 × 1080</button>
        <button id="export-portrait" type="button">1080 × 1350</button>
        <button id="export-wide" type="button">1920 × 1080</button>
        <button id="export-all" type="button" class="wide">Export all three sizes</button>
      </div>
      <p id="status" role="status"></p>
    </div>
  </section>
  <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
