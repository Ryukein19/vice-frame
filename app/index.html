<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Frame — turn your photos into GTA-style cover art</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" id="controls">
    <h1>VICE FRAME</h1>
    <p class="tagline">Your photos become GTA-style cover art.</p>

    <div class="group">
      <h2>Layout</h2>
      <div id="layouts" class="picker"></div>
    </div>

    <div class="group">
      <h2>Grade</h2>
      <div id="grades" class="picker"></div>
    </div>

    <label>Caption
      <input id="caption" type="text" maxlength="24" value="SUNSET HEIST">
    </label>
    <label>Subtitle
      <input id="subtitle" type="text" maxlength="40" value="a vice city story">
    </label>

    <div class="group">
      <h2>Photos</h2>
      <div id="samples" class="thumbs"></div>
      <button id="loadSamples" type="button">Load the sample photos</button>
    </div>

    <div class="group">
      <h2>Selected panel</h2>
      <p id="selectedLabel">Click a panel on the cover to select it.</p>
      <label>Zoom
        <input id="zoom" type="range" min="0.8" max="2" step="0.05" value="1">
      </label>
      <button id="autofocus" type="button">Auto-focus on the subject</button>
      <label>Role tag
        <input id="role" type="text" maxlength="20">
      </label>
      <label>Replace photo
        <input id="upload" type="file" accept="image/*">
      </label>
    </div>

    <div class="group">
      <h2>Export PNG</h2>
      <div class="exports">
        <button data-export="1080x1080" type="button">1080 × 1080</button>
        <button data-export="1080x1350" type="button">1080 × 1350</button>
        <button data-export="1920x1080" type="button">1920 × 1080</button>
      </div>
      <button id="exportAll" type="button">Export all 3 PNGs</button>
    </div>

    <p id="status" role="status"></p>
  </section>

  <section class="preview">
    <canvas id="cover" width="1280" height="720" aria-label="Live cover preview"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
